name: VaultGo
options:
  bundleIdPrefix: com.magpieapp.vaultgo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: en
  # 每次 generate 后自动校验必需 entitlement，防止被静默覆盖后"设置里看不到 VaultGo"
  postGenCommand: bash Scripts/verify-entitlements.sh

configs:
  Debug: debug
  Release: release
  Debug-CN: debug
  Release-CN: release

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.8"
    DEVELOPMENT_TEAM: T34FRBNZP8
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug-CN:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG CN
    Release-CN:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: "5.6.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: "4.2.2"
  SVGKit:
    url: https://github.com/SVGKit/SVGKit.git
    from: "3.0.0"

targets:
  VaultGo:
    type: application
    platform: iOS
    sources:
      - path: VaultGo
        excludes:
          - "**/.DS_Store"
    resources:
      - path: VaultGo/Resources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: VaultGo/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.magpieapp.vaultgo
        APP_GROUP_ID: com.magpieapp.vaultgo.shared
        PRODUCT_NAME: VaultGo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "YES"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_ENTITLEMENTS: VaultGo/VaultGo.entitlements
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        Debug-CN:
          PRODUCT_BUNDLE_IDENTIFIER: com.magpieapp.vaultgo.cn
          APP_GROUP_ID: com.magpieapp.vaultgo.cn.shared
        Release-CN:
          PRODUCT_BUNDLE_IDENTIFIER: com.magpieapp.vaultgo.cn
          APP_GROUP_ID: com.magpieapp.vaultgo.cn.shared
    dependencies:
      - package: SnapKit
      - package: KeychainAccess
      - package: SVGKit
      - sdk: CloudKit.framework
      - target: AutoFillProvider
        embed: true
    entitlements:
      path: VaultGo/VaultGo.entitlements
      properties:
        # ⚠️ 必须在此声明：xcodegen 会按本段重写 entitlements 文件，
        # 只改文件而不改这里，下次 `xcodegen generate` 就会被抹掉
        # （Autofill Credential Provider 扩展点的硬性 entitlement）
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups:
          - group.$(APP_GROUP_ID)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(APP_GROUP_ID)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudKit

  AutoFillProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoFillProvider
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: AutoFillProvider/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.magpieapp.vaultgo.autofill
        APP_GROUP_ID: com.magpieapp.vaultgo.shared
        PRODUCT_NAME: AutoFillProvider
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: AutoFillProvider/AutoFillProvider.entitlements
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        Debug-CN:
          PRODUCT_BUNDLE_IDENTIFIER: com.magpieapp.vaultgo.cn.autofill
          APP_GROUP_ID: com.magpieapp.vaultgo.cn.shared
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG CN
        Release-CN:
          PRODUCT_BUNDLE_IDENTIFIER: com.magpieapp.vaultgo.cn.autofill
          APP_GROUP_ID: com.magpieapp.vaultgo.cn.shared
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: CN
    dependencies:
      - package: SnapKit
      - package: KeychainAccess
    entitlements:
      path: AutoFillProvider/AutoFillProvider.entitlements
      properties:
        # ⚠️ 必须在此声明：xcodegen 会按本段重写 entitlements 文件。
        # 缺这项 CredentialProviderExtensionHelper 会把扩展排除
        # （表现为 Console 里 Final plugin count: 0、设置中看不到 VaultGo）
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups:
          - group.$(APP_GROUP_ID)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(APP_GROUP_ID)

schemes:
  VaultGo:
    build:
      targets:
        VaultGo: all
        AutoFillProvider: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  VaultGo-CN:
    build:
      targets:
        VaultGo: all
        AutoFillProvider: all
    run:
      config: Debug-CN
    test:
      config: Debug-CN
    profile:
      config: Release-CN
    analyze:
      config: Debug-CN
    archive:
      config: Release-CN
