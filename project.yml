name: VaultCell
options:
  bundleIdPrefix: com.magpie.vaultcell
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: en
  # 每次 generate 后自动校验必需 entitlement，防止被静默覆盖后"设置里看不到 VaultCell"
  postGenCommand: bash Scripts/verify-entitlements.sh

configs:
  Debug: debug
  Release: release
  Debug-CN: debug
  Release-CN: release

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.8"
    DEVELOPMENT_TEAM: T34FRBNZP8
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug-CN:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG CN
    Release-CN:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: "5.6.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: "4.2.2"

targets:
  VaultCell:
    type: application
    platform: iOS
    sources:
      # Icon Composer 图标包（Xcode 26 的 icon stack）：必须整体交给 actool 当输入目录。
      # 要点（xcodegen 2.43 实测）：
      # 1. 必须写在 sources 里 —— resources 中带 type 的条目会被静默丢弃；
      # 2. 不能用 type: folder —— 会写成 lastKnownFileType = folder，Xcode 只把它当普通
      #    资源目录拷贝，actool 收不到，报 "None of the input catalogs ... named VaultCell"；
      # 3. type: file 时不写 lastKnownFileType，Xcode 按扩展名推断为 folder.iconcomposer.icon。
      - path: VaultCell/Resources/VaultCell.icon
        type: file
        buildPhase: resources
      - path: VaultCell
        excludes:
          - "**/.DS_Store"
          # VaultCell.icon 不能被展开成内部的 icon.json / svg 拷进 bundle
          - "Resources/VaultCell.icon/**"
          # 仓库内的说明文档（如 SafetyNotes/Tags.md）不应被打进 App bundle
          - "**/*.md"
      # 主 App 与 AutoFill 扩展共享的纯逻辑源码（注册端与匹配端必须同源）
      - path: Shared/AutoFillDomainMatcher.swift
      - path: Shared/AutoFillCredentialIdentityFactory.swift
      - path: Shared/AutoFillSharedKeys.swift
      - path: Shared/VaultWriteSemantics.swift
      - path: Shared/VaultCoreDataStoreConfiguration.swift
    resources:
      - path: VaultCell/Resources
        excludes:
          - "**/.DS_Store"
          - "VaultCell.icon/**"
    settings:
      base:
        INFOPLIST_FILE: VaultCell/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.magpie.vaultcell
        APP_GROUP_ID: com.magpie.vaultcell.shared
        ICLOUD_CONTAINER_ID: iCloud.com.magpie.vaultcell
        PRODUCT_NAME: VaultCell
        ASSETCATALOG_COMPILER_APPICON_NAME: VaultCell
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "YES"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_ENTITLEMENTS: VaultCell/VaultCell.entitlements
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          APS_ENVIRONMENT: development
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          APS_ENVIRONMENT: production
        Debug-CN:
          PRODUCT_BUNDLE_IDENTIFIER: com.magpie.vaultcell.cn
          APP_GROUP_ID: com.magpie.vaultcell.cn.shared
          ICLOUD_CONTAINER_ID: iCloud.com.magpie.vaultcell.cn
          APS_ENVIRONMENT: development
        Release-CN:
          PRODUCT_BUNDLE_IDENTIFIER: com.magpie.vaultcell.cn
          APP_GROUP_ID: com.magpie.vaultcell.cn.shared
          ICLOUD_CONTAINER_ID: iCloud.com.magpie.vaultcell.cn
          APS_ENVIRONMENT: production
    dependencies:
      - package: SnapKit
      - package: KeychainAccess
      - target: AutoFillProvider
        embed: true
    entitlements:
      path: VaultCell/VaultCell.entitlements
      properties:
        # ⚠️ 必须在此声明：xcodegen 会按本段重写 entitlements 文件，
        # 只改文件而不改这里，下次 `xcodegen generate` 就会被抹掉
        # （Autofill Credential Provider 扩展点的硬性 entitlement）
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups:
          - group.$(APP_GROUP_ID)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(APP_GROUP_ID)
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - $(ICLOUD_CONTAINER_ID)
        # CKSyncEngine 的 zone subscription 依赖 APNs 静默推送唤醒多端同步
        # （AppState.enableCloudSync() 会 registerForRemoteNotifications）。
        # Debug 走 development、Release 走 production，取值由 APS_ENVIRONMENT 提供。
        aps-environment: $(APS_ENVIRONMENT)

  VaultCellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VaultCellTests
        excludes:
          - "**/.DS_Store"
      # 纯逻辑测试（无 host app）：直接编译被测服务及其领域模型源码，
      # 避免以 CODE_SIGNING_ALLOWED=NO 启动 host app 时 CloudKit 崩溃。
      - path: VaultCell/Domain/Services/IdentityUsageAuditService.swift
      - path: VaultCell/Domain/Models/PasswordEntry.swift
      - path: VaultCell/Domain/Models/TwoFactorConfig.swift
      - path: VaultCell/Domain/Models/OAuthProviderConfig.swift
      - path: VaultCell/Data/Repositories/PasswordCategory.swift
      - path: VaultCell/Core/Utils/Colors.swift
      - path: VaultCell/Domain/Models/Tag.swift
      # 图标链路的纯逻辑（Foundation / CryptoKit / CoreGraphics，无 UIKit，可脱离 host app 编译）
      - path: VaultCell/Core/Services/Icons/DomainKey.swift
      - path: VaultCell/Core/Services/Icons/IconSafety.swift
      # TOTP（RFC 6238）纯逻辑（CryptoKit + Foundation，无 Keychain / UIKit，可脱离 host app 编译）
      - path: VaultCell/Core/Security/TOTPService.swift
      # 解锁失败限流的纯策略（仅 Foundation，无 Keychain / UIKit）
      - path: VaultCell/Domain/Services/UnlockThrottleService.swift
      - path: VaultCell/Domain/Services/Sync/SyncProtocol.swift
      - path: Shared/VaultWriteSemantics.swift
      - path: Shared/VaultCoreDataStoreConfiguration.swift
      # 文案解析：模型层（PasswordEntry / TwoFactorConfig / 审计服务）改用 AppLocale，
      # 测试 target 需要一并编译 AppLocale 及其语言读取依赖
      - path: VaultCell/Core/Utils/AppLocale.swift
      - path: VaultCell/Core/Utils/AppLanguage.swift
      - path: VaultCell/Core/Utils/Bundle+Language.swift
      - path: VaultCell/Core/Utils/Constants.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magpie.vaultcell.tests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_EMIT_LOC_STRINGS: "NO"

  AutoFillProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoFillProvider
        excludes:
          - "**/.DS_Store"
      # 共享主 App 的 Core Data 模型：编译为 VaultCell.momd 打进扩展 Bundle，
      # 扩展据此打开 App Group 中的同一份 SQLite（模型必须与主 App 同步升级）
      - path: VaultCell/Resources/VaultCell.xcdatamodeld
      # 主 App 与 AutoFill 扩展共享的纯逻辑源码（注册端与匹配端必须同源）
      - path: Shared/AutoFillDomainMatcher.swift
      - path: Shared/AutoFillCredentialIdentityFactory.swift
      - path: Shared/AutoFillSharedKeys.swift
      - path: Shared/VaultWriteSemantics.swift
      - path: Shared/VaultCoreDataStoreConfiguration.swift
    settings:
      base:
        INFOPLIST_FILE: AutoFillProvider/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.magpie.vaultcell.autofill
        APP_GROUP_ID: com.magpie.vaultcell.shared
        PRODUCT_NAME: AutoFillProvider
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: AutoFillProvider/AutoFillProvider.entitlements
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        Debug-CN:
          PRODUCT_BUNDLE_IDENTIFIER: com.magpie.vaultcell.cn.autofill
          APP_GROUP_ID: com.magpie.vaultcell.cn.shared
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG CN
        Release-CN:
          PRODUCT_BUNDLE_IDENTIFIER: com.magpie.vaultcell.cn.autofill
          APP_GROUP_ID: com.magpie.vaultcell.cn.shared
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: CN
    dependencies:
      # 扩展侧无 KeychainAccess 使用方（凭据读取走共享 Core Data + Security 框架），
      # AutoFillKeychainService 删除后不再链接该包
      - package: SnapKit
    entitlements:
      path: AutoFillProvider/AutoFillProvider.entitlements
      properties:
        # ⚠️ 必须在此声明：xcodegen 会按本段重写 entitlements 文件。
        # 缺这项 CredentialProviderExtensionHelper 会把扩展排除
        # （表现为 Console 里 Final plugin count: 0、设置中看不到 VaultCell）
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups:
          - group.$(APP_GROUP_ID)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(APP_GROUP_ID)

schemes:
  VaultCell:
    build:
      targets:
        VaultCell: all
        AutoFillProvider: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VaultCellTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  VaultCell-CN:
    build:
      targets:
        VaultCell: all
        AutoFillProvider: all
    run:
      config: Debug-CN
    test:
      config: Debug-CN
      targets:
        - VaultCellTests
    profile:
      config: Release-CN
    analyze:
      config: Debug-CN
    archive:
      config: Release-CN
